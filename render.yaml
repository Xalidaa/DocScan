services:
  - type: web
    name: docscan-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CLAUDE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ERP_MOCK_MODE
        value: "True"
